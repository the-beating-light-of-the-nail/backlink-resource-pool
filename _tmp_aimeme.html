      // 海外首访语言引导：默认中文首页 (/) 上，无语言偏好的非中文浏览器静默跳转对应语言版。
      // 爬虫/社交抓取器不跳（SEO 无损）；任何一次手动选择都会写入 gj-lang，此后不再自动跳。
      (function () {
        try {
          if (window.location.pathname !== "/") return;
          try { if (localStorage.getItem("gj-lang")) return; } catch (e) { return; }
          var ua = navigator.userAgent || "";
          if (/bot|crawl|spider|slurp|headless|lighthouse|pingdom|facebook|twitter|pinterest|slack|discord|telegram|whatsapp|line\/|skype|snapchat|preview/i.test(ua)) return;
          var prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
          var target = null;
          for (var i = 0; i < prefs.length; i++) {
            var l = String(prefs[i] || "").toLowerCase();
            if (!l) continue;
            if (l.indexOf("zh") === 0) {
              // zh-TW / zh-HK 等繁体环境 → 繁体版；简体环境留在默认
              if (/^zh[-_](tw|hant|hk|mo)/.test(l)) target = "zh-Hant";
              break;
            }
            if (l.indexOf("ja") === 0) { target = "ja"; break; }
            if (l.indexOf("en") === 0 && !target) target = "en";
          }
          if (!target) return;
          try { localStorage.setItem("gj-lang", target); } catch (e) {}
          window.location.replace("/" + target + window.location.search + window.location.hash);
        } catch (e) { /* 任何异常都留在默认页 */ }
      })();
    </script>
